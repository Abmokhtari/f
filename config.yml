baseURL: "https://<username>.github.io/<repo-name>/"
title: گاه‌نوشته‌های ابوالفضل مختاری
theme: PaperMod
copyright: کلیه حقوق محفوظ است. انتشار مطالب تحت مجوز [CC-BY-4.0](https://creativecommons.org/licenses/by/4.0/) آزاد است.
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

defaultContentLanguage: fa
languageCode: fa-ir

languages:
  fa:
    languageName: "فارسی"
    weight: 1
    languageDirection: rtl
    title: گاه‌نوشته‌های ابوالفضل مختاری

pagination:
  disableAliases: false
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: گاه‌نوشته‌های ابوالفضل مختاری
  description: "گاه‌نوشته‌هایی درباره تفکر سیستمی، علوم زمین، متالرنینگ و پالایش نویز."
  keywords: [وبلاگ, توسعه فردی, متالرنینگ, زمین‌شناسی, تفکر سیستمی]
  author: ابوالفضل مختاری
  DateFormat: "2 January 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowPageNums: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    disableFingerprinting: true

  label:
    text: "خانه"
    iconHeight: 35

  # بخش پیام خوش‌آمدگویی بالای صفحه اصلی
  homeInfoParams:
    Title: "ابوالفضل مختاری"
    Content: |
      به باغ یادگیری من خوش آمدید.  
      اینجا فضایی است برای یادگیری عمیق، تفکر سیستمی، علوم زمین و پرورش ایده‌ها دور از هیاهو و نویزهای روزمره.

menu:
  main:
    - identifier: archives
      name: آرشیو
      url: /archives/
      weight: 10
    - identifier: search
      name: جستجو
      url: /search/
      weight: 15
    - identifier: tags
      name: موضوعات
      url: /tags/
      weight: 20
    - identifier: bio
      name: درباره من
      url: /bio/
      weight: 30

pygmentsUseClasses: true
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

outputs:
  home:
    - HTML
    - RSS
    - JSON
